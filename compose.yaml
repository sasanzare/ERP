name: erp-local

services:
  db:
    image: mariadb:11.8.9-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run scripts/Initialize-Local.ps1 to create local credentials}
      MARIADB_DATABASE: ${DB_DATABASE:-erp_dev}
      MARIADB_USER: ${DB_USERNAME:-erp_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/Initialize-Local.ps1 to create local credentials}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-erp_test}
      DB_TEST_USERNAME: ${DB_TEST_USERNAME:-erp_test}
      DB_TEST_PASSWORD: ${DB_TEST_PASSWORD:?Run scripts/Initialize-Local.ps1 to create local credentials}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mariadb_data:
    name: erp_mariadb_data
